name: release-qualification-mobile

on:
  workflow_dispatch:
    inputs:
      qualification_reason:
        description: 'Why remote macOS/Xcode release qualification is required'
        required: true
        type: string

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.x'
      - name: Workflow policy gate
        run: python3 tools/verify_workflow_policy.py
      - name: JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/attachments.js
          node --check web/voice.js
          node --check web/call.js
          node --check web/sw.js
      - name: Multimodal and voice behavior
        run: node --test test/*.test.mjs
      - name: Mobile boundary/static gate
        run: python3 tools/mobile_boundary_static_gate.py

  native-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build native body agent core
        run: swift build --package-path native/BodyAgentCore
      - name: Build native body agent core for iOS Simulator
        working-directory: native/BodyAgentCore
        run: xcodebuild -scheme BodyAgentCore -destination 'generic/platform=iOS Simulator' -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Build native eCompanion body app for iOS Simulator
        run: xcodebuild -project native/ECompanionBodyApp/ECompanionBodyApp.xcodeproj -scheme ECompanionBodyApp -destination 'generic/platform=iOS Simulator' -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Test native body agent core
        run: swift test --package-path native/BodyAgentCore
